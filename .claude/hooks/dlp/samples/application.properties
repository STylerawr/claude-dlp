# Sample Spring-style properties for trying the dlp hook. All values are fake.

spring.application.name=sample-app
spring.datasource.url=jdbc:postgresql://localhost:5432/sample
spring.datasource.username=sample_user
spring.datasource.password=sample-datasource-password-NOT-REAL
mail.smtp.pwd=sample-smtp-pwd-NOT-REAL
app.apiKey=sample-api-key-NOT-REAL
app.client-secret=sample-client-secret-NOT-REAL

# Only the password inside a URL query is masked; the rest of the URL stays readable.
report.url=https://reports.example.com/export?user=sample_user&password=sample-report-password-NOT-REAL

# Only the Password inside a connection string is masked.
sql.connection_string=Server=localhost;Database=sample;User ID=sample_user;Password=sample-sql-password-NOT-REAL;Encrypt=True

# A placeholder is masked too, since the key name contains a filter word (a known false positive).
server.ssl.key-store-password=${KEYSTORE_PASSWORD:changeme-NOT-REAL}

# --- Known limitations: the lines below are NOT detected ---
# The key name contains no filter word.
github.token=sample-github-token-NOT-REAL
# The credential is embedded in a URL with no key-name clue.
cache.redis.url=redis://:sample-redis-password-NOT-REAL@localhost:6379
